<div class="qlingo-expression-editor card">
  <!-- Header -->
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="bi bi-code-square me-2"></i>
      QLingo Expression Editor
    </h5>
    <div class="btn-group btn-group-sm ms-auto" role="group">
      <button
        type="button"
        class="btn"
        [class.btn-primary]="editMode === 'visual'"
        [class.btn-outline-secondary]="editMode !== 'visual'"
        (click)="switchMode('visual')">
        <i class="bi bi-diagram-3"></i> Visual
      </button>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="editMode === 'text'"
        [class.btn-outline-secondary]="editMode !== 'text'"
        (click)="switchMode('text')">
        <i class="bi bi-code"></i> Text
      </button>
    </div>
  </div>

  <!-- Visual Editor Mode - Using Inline Editor -->
  <div *ngIf="editMode === 'visual'">
    <app-qlingo-expression-editor-inline
      [expression]="expression"
      [availableVariables]="availableVariables"
      [templateContext]="templateContext"
      [variables]="variables"
      [enablePreview]="enablePreview"
      (expressionChange)="onInlineExpressionChange($event)"
      (expressionApplied)="expressionApplied.emit($event)">
    </app-qlingo-expression-editor-inline>
  </div>

  <!-- Text Editor Mode -->
  <div *ngIf="editMode === 'text'">
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label fw-bold">QLingo Expression:</label>
        <textarea
          class="form-control font-monospace"
          rows="8"
          [(ngModel)]="textExpression"
          placeholder="Enter QLingo expression..."></textarea>
      </div>
      <button class="btn btn-primary btn-sm" (click)="switchMode('visual')">
        <i class="bi bi-arrow-left-right me-1"></i> Switch to Visual Mode (Parse)
      </button>

      <!-- Generated Expression Display -->
      <div class="generated-expression mt-3 p-3 bg-light border rounded">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label fw-bold mb-0">
            <i class="bi bi-code-slash me-1"></i> Generated Expression:
          </label>
          <button class="btn btn-sm btn-outline-secondary" (click)="reset()">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
          </button>
        </div>
        <pre class="mb-0 p-2 bg-white border rounded"><code>{{ generatedExpression || '(empty)' }}</code></pre>
      </div>

      <!-- Preview -->
      <div *ngIf="enablePreview" class="preview mt-3 p-3 border rounded"
           [class.bg-success-subtle]="hasPreviewResult()"
           [class.bg-danger-subtle]="hasPreviewError()">
        <label class="form-label fw-bold">
          <i class="bi bi-eye me-1"></i> Preview Result:
        </label>
        <div *ngIf="hasPreviewError()" class="text-danger">
          <strong>Error:</strong> {{ previewError }}
        </div>
        <div *ngIf="hasPreviewResult()" class="preview-result">
          <strong>Result:</strong>
          <code class="ms-2">{{ previewResult }}</code>
          <small class="text-muted ms-2">({{ getTypeOf(previewResult) }})</small>
        </div>
        <div *ngIf="isPreviewResultNull()" class="text-muted">
          <em>Expression evaluates to NULL</em>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="card-footer">
      <div class="d-flex gap-2">
        <button class="btn btn-success" (click)="applyExpression()">
          <i class="bi bi-check-circle me-1"></i> Apply Expression
        </button>
        <button class="btn btn-secondary" (click)="reset()">
          <i class="bi bi-x-circle me-1"></i> Cancel
        </button>
      </div>
    </div>
  </div>
</div>
